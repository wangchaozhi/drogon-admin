name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本 tag（必须与 VERSION 一致，例如 v0.1.1）"
        required: true
        type: string
      redispatch_existing:
        description: "仅用于恢复分发失败：允许重新分发指向当前 main 提交的既有 tag"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Create tag and dispatch release builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::正式发布必须从 main 分支执行，当前 ref: $GITHUB_REF"
            exit 1
          fi

      - name: Verify release version
        env:
          EXPECTED_RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/verify_release_version.py

      - name: Create and push tag
        env:
          REDISPATCH_EXISTING: ${{ inputs.redispatch_existing }}
        shell: bash
        run: |
          TAG='${{ inputs.tag }}'
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            if [[ "$REDISPATCH_EXISTING" != "true" ]]; then
              echo "::error::tag $TAG 已存在；仅在恢复失败的分发时启用 redispatch_existing"
              exit 1
            fi
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
            if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "::error::既有 tag $TAG 指向 $TAG_COMMIT，而当前 main 为 $GITHUB_SHA"
              exit 1
            fi
            echo "::notice::复用指向当前 main 的既有 tag $TAG 并重新分发"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

      # GITHUB_TOKEN 推送的 tag 不会触发新的 workflow，因此显式在该 tag 上
      # 分发所有组件构建，确保一次手动发版不会遗漏任何平台产物。
      - name: Dispatch component release workflows
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          dispatch() {
            local workflow="$1"
            for attempt in 1 2 3 4 5; do
              if gh workflow run "$workflow" --ref "$TAG"; then
                echo "::notice::已在 $TAG 上分发 $workflow"
                return 0
              fi
              if [[ "$attempt" -lt 5 ]]; then
                sleep 2
              fi
            done
            echo "::error::无法在 $TAG 上分发 $workflow"
            return 1
          }

          dispatch backend.yml
          dispatch frontend.yml
          dispatch musl-release.yml
