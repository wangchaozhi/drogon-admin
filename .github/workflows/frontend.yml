name: frontend

on:
  # 推送 tag（如 v1.2.3）时自动构建前端并把压缩包发布到 GitHub Release
  push:
    tags:
      - "v*"
  # 保留 PR 质量门：面向 main 的 PR 涉及前端相关路径时仍自动验证构建
  pull_request:
    branches: [main]
    paths:
      - "front/**"
      - "VERSION"
      - "CMakeLists.txt"
      - "vcpkg.json"
      - "scripts/**"
      - ".github/workflows/**"
  # 手动触发仅构建；正式发版由 release workflow 统一创建 tag 并调度。
  workflow_dispatch:

# tag 构建需要写仓库内容以创建 Release 并上传资产
permissions:
  contents: write

jobs:
  build:
    name: Lint & Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    strategy:
      fail-fast: false
      matrix:
        node: ["26"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify release version
        working-directory: ${{ github.workspace }}
        run: python scripts/verify_release_version.py

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        # 说明：lockfile 在 Windows 生成时不包含 Linux 专用的 optional 依赖
        # （如 @emnapi/core、@emnapi/runtime），导致 `npm ci` 因不同步而失败。
        # 这里改用 `npm install`，并通过 --prefer-offline 最大化利用缓存。
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload dist artifact (workflow artifact)
        uses: actions/upload-artifact@v7
        with:
          name: front-dist
          path: front/dist
          if-no-files-found: error
          retention-days: 7

      # ---------- 以下仅在 tag 上运行时发布 ----------
      - name: Resolve release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG='${{ github.ref_name }}'
          if [[ -z "$TAG" ]]; then
            echo "::error::无法解析 Release tag"
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Package release asset
        if: startsWith(github.ref, 'refs/tags/')
        # 覆盖 defaults.run.working-directory 为仓库根，避免 front 下相对路径混乱
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          asset="drogon-admin-front-${RELEASE_TAG}.zip"
          (cd front/dist && zip -r "$GITHUB_WORKSPACE/$asset" .)
          sha256sum "$asset" > "$asset.sha256"
          echo "ASSET_PATH=$asset" >> "$GITHUB_ENV"
          echo "CHECKSUM_PATH=$asset.sha256" >> "$GITHUB_ENV"

      - name: Upload packaged release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: front-release
          path: |
            ${{ env.ASSET_PATH }}
            ${{ env.CHECKSUM_PATH }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ${{ env.ASSET_PATH }}
            ${{ env.CHECKSUM_PATH }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
