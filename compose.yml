services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.musl
      target: runtime
    image: drogon-admin:local
    init: true
    restart: unless-stopped
    environment:
      DROGON_ENV: production
      DROGON_JWT_SECRET: ${DROGON_JWT_SECRET:?Set DROGON_JWT_SECRET to at least 32 random characters}
      DROGON_REGISTRATION_MODE: ${DROGON_REGISTRATION_MODE:-first-user}
      DROGON_CORS_ALLOWED_ORIGINS: ${DROGON_CORS_ALLOWED_ORIGINS:-}
      DROGON_CORS_ALLOW_CREDENTIALS: ${DROGON_CORS_ALLOW_CREDENTIALS:-false}
      DROGON_ENABLE_HSTS: ${DROGON_ENABLE_HSTS:-false}
    ports:
      - "127.0.0.1:${DROGON_PORT:-8080}:8080"
    volumes:
      - drogon-data:/app/data
      - drogon-logs:/app/logs
      - drogon-uploads:/app/uploads
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 15s

volumes:
  drogon-data:
  drogon-logs:
  drogon-uploads:
