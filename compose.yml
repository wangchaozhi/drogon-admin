services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.musl
      target: runtime
    image: drogon-admin:local
    init: true
    restart: unless-stopped
    environment:
      DROGON_ENV: production
      DROGON_JWT_SECRET_FILE: /run/secrets/drogon_jwt_secret
      DROGON_REGISTRATION_MODE: ${DROGON_REGISTRATION_MODE:-first-user}
      DROGON_LOGIN_RATE_LIMIT_GLOBAL: ${DROGON_LOGIN_RATE_LIMIT_GLOBAL:-120}
      DROGON_LOGIN_RATE_LIMIT_PER_IDENTIFIER: ${DROGON_LOGIN_RATE_LIMIT_PER_IDENTIFIER:-10}
      DROGON_LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${DROGON_LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      DROGON_CORS_ALLOWED_ORIGINS: ${DROGON_CORS_ALLOWED_ORIGINS:-}
      DROGON_CORS_ALLOW_CREDENTIALS: ${DROGON_CORS_ALLOW_CREDENTIALS:-false}
      DROGON_ENABLE_HSTS: ${DROGON_ENABLE_HSTS:-false}
      DROGON_SHUTDOWN_GRACE_SECONDS: ${DROGON_SHUTDOWN_GRACE_SECONDS:-10}
    ports:
      - "127.0.0.1:${DROGON_PORT:-8080}:8080"
    volumes:
      - drogon-data:/app/data
      - drogon-logs:/app/logs
      - drogon-uploads:/app/uploads
    secrets:
      - drogon_jwt_secret
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 15s

  backup:
    profiles: ["ops"]
    image: ${DROGON_BACKUP_IMAGE:-python:3.13-alpine}
    user: "${DROGON_BACKUP_UID:-0}:${DROGON_BACKUP_GID:-0}"
    network_mode: none
    read_only: true
    working_dir: /ops
    entrypoint: ["python3", "/ops/sqlite_backup.py"]
    command:
      - backup
      - --source
      - /app/data/drogon-admin.db
      - --output-dir
      - /backups
      - --retain
      - "${DROGON_BACKUP_RETAIN:-14}"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - type: volume
        source: drogon-data
        target: /app/data
        read_only: true
      - type: bind
        source: ${DROGON_BACKUP_DIR:-./backups}
        target: /backups
      - type: bind
        source: ./scripts/sqlite_backup.py
        target: /ops/sqlite_backup.py
        read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    restart: "no"

volumes:
  drogon-data:
  drogon-logs:
  drogon-uploads:

secrets:
  drogon_jwt_secret:
    file: ${DROGON_JWT_SECRET_PATH:-./secrets/jwt_secret}
